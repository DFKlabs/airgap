<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>airgap — text you can hear</title>
<meta name="description" content="Send a message from one phone to another with sound. Flight mode on: no internet, no server, no account. One page, no dependencies. By DFK Labs.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="airgap — send text over sound">
<meta property="og:description" content="Two phones, flight mode on. One chirps, the other reads the message and chirps back that it heard it. Morse too. No internet, no server, no account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Cg fill='none' stroke='%232563eb' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M22 22a14 14 0 0 1 0 20'/%3E%3Cpath d='M31 15a24 24 0 0 1 0 34'/%3E%3Cpath d='M40 8a34 34 0 0 1 0 48'/%3E%3C/g%3E%3Ccircle cx='14' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="/fonts/motion.css">
<style>
:root{--bg:#050505;--panel:#0f1115;--panel2:#16191e;--panel3:#1d2128;--line:rgba(255,255,255,.08);--ink:#f3f4f6;--dim:#9ca3af;--mute:#6b7280;--blue:#2563eb;--blue2:#60a5fa;--ok:#34d399;--bad:#f87171;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--spring:cubic-bezier(.2,.9,.3,1.2)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{--navh:48px;min-height:100dvh}
.stage{display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:560px;height:calc(100dvh - var(--navh));display:flex;flex-direction:column;background:var(--bg)}
.app::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 380px at 50% -10%,rgba(37,99,235,.16),transparent 70%);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}

/* header */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line);background:rgba(5,5,5,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.avatar{width:40px;height:40px;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font:700 17px/1.2 var(--sans);letter-spacing:-.01em}
.who span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span i{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.who span.on i{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px;transition:background .2s,border-color .2s}
.pill svg{width:16px;height:16px}
.pill.on{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4);color:var(--ok)}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.icon svg{width:17px;height:17px}

/* thread */
#thread{position:relative;flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.day{align-self:center;margin:10px 0 8px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.empty{margin:auto;max-width:300px;text-align:center;display:grid;gap:14px;justify-items:center;color:var(--dim);font-size:14.5px;line-height:1.5}
.empty .wave{width:72px;height:72px}
.empty b{color:var(--ink);font-size:17px}
.empty ol{text-align:left;padding-left:20px;display:grid;gap:6px}
.row{display:flex;flex-direction:column;max-width:80%;animation:pop .32s var(--spring)}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start;align-items:flex-start}
.row + .row.me,.row + .row.them{margin-top:2px}
.row.me + .row.them,.row.them + .row.me{margin-top:10px}
.bubble{position:relative;padding:9px 13px 7px;border-radius:20px;font-size:16.5px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;overflow:hidden;user-select:text;-webkit-user-select:text}
.me .bubble{background:var(--blue);border-bottom-right-radius:6px}
.them .bubble{background:var(--panel3);border-bottom-left-radius:6px}
.bubble a{color:inherit}
.bubble .code{display:block;margin-top:3px;font:500 11px/1.4 var(--mono);letter-spacing:.04em;opacity:.65;word-break:break-all}
.bubble .prog{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.75);transform-origin:left;transform:scaleX(0)}
.meta{display:flex;align-items:center;gap:6px;margin:3px 6px 0;font:500 11px var(--sans);color:var(--mute)}
.meta .tag{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:var(--panel2);color:var(--dim)}
.meta .tick{display:inline-flex;align-items:center;gap:3px}
.meta .tick svg{width:15px;height:15px}
.meta .heard{color:var(--ok)}
.meta button{border:0;background:none;color:var(--blue2);font:600 11px var(--sans);padding:2px 0}
.typing .bubble{font-family:var(--mono);letter-spacing:.04em}
.typing .bubble::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--ok)}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

/* banner */
.banner{margin:0 12px 6px;padding:10px 12px;border-radius:14px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);font-size:13.5px;line-height:1.45;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner p{flex:1}
.banner button{border:0;background:none;color:var(--dim);font-size:18px;line-height:1;padding:0 2px}

/* composer */
.bottom{position:relative;z-index:2;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:rgba(5,5,5,.8);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ear{display:flex;align-items:center;gap:10px;height:22px;padding:0 4px;color:var(--mute);font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ear canvas{flex:1 1 0;width:0;height:22px;min-width:0}
.ear b{color:var(--dim);font-weight:600;min-width:52px;text-align:right}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);justify-self:start}
.seg button{border:0;background:none;padding:5px 14px;border-radius:8px;font:600 13px var(--sans);color:var(--dim);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.bar{display:flex;align-items:flex-end;gap:8px}
.field{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:22px;background:var(--panel2);border:1px solid var(--line);transition:border-color .2s}
.field:focus-within{border-color:rgba(96,165,250,.5)}
textarea{display:block;width:100%;resize:none;max-height:140px;background:none;border:0;outline:none;color:var(--ink);font:400 16.5px/1.35 var(--sans);padding:10px 14px 2px}
.hint{display:flex;justify-content:space-between;gap:8px;padding:0 14px 7px;font:500 10.5px var(--mono);color:var(--mute);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.hint span:last-child{overflow:hidden;text-overflow:ellipsis}
.hint .over{color:var(--bad)}
.send{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(37,99,235,.9);transition:transform .15s,opacity .2s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;box-shadow:none}
.send svg{width:22px;height:22px}
.send.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet > div{width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(30px);transition:transform .3s var(--spring);display:grid;gap:16px}
.sheet.open > div{transform:none}
.grab{justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--panel3)}
.sheet h2{font:700 20px var(--sans);letter-spacing:-.01em}
.sheet p{color:var(--dim);font-size:14.5px;line-height:1.55}
.sheet code{font:500 12.5px var(--mono);color:var(--blue2)}
.group{border-radius:16px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;font-size:15px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.item.danger{color:var(--bad)}
.switch{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--panel3);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .25s var(--spring)}
[aria-checked="true"] .switch{background:var(--ok)}
[aria-checked="true"] .switch::after{transform:translateX(18px)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font:500 11px var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.foot a{color:var(--mute);text-decoration:none}
.dfk{display:inline-grid;place-items:center;border:2px solid var(--ink);color:var(--ink);font:900 11px var(--sans);letter-spacing:0;padding:1px 5px;box-shadow:3px 3px 0 var(--blue)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);z-index:20;transform:translate(-50%,-8px);background:var(--panel3);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .3s var(--spring);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* the little honest line, the pieces, the waterfall, the lab */
.note{margin:0 12px 6px;font-size:12px;line-height:1.45;color:var(--mute);text-align:center}
.pieces{display:flex;flex-wrap:wrap;gap:3px;margin:4px 6px 0}
.pieces i{width:12px;height:12px;border-radius:3px;background:var(--panel3);border:1px solid var(--line);transition:background .25s,transform .25s var(--spring)}
.pieces i.p1{background:var(--blue2);border-color:transparent}
.pieces i.p2{background:var(--ok);border-color:transparent}
.pieces i.new{transform:scale(1.25)}
.details{display:none;margin:4px 6px 0;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font:500 11.5px/1.5 var(--mono);color:var(--dim);max-width:280px}
.row.open .details{display:block}
.details b{color:var(--ink);font-weight:600}
.details .legend{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.details .legend span{display:inline-flex;align-items:center;gap:4px}
.details .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bubble{cursor:pointer}
.ear canvas{border-radius:6px;background:#0a0c10}
.lab{display:grid;gap:12px}
.lab input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;color:var(--ink);font:500 17px var(--sans);outline:none}
.lab input:focus{border-color:rgba(96,165,250,.5)}
.step{display:grid;gap:7px}
.step h3{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue2)}
.step p{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:grid;justify-items:center;gap:1px;min-width:34px;padding:5px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font:600 13px var(--mono);color:var(--ink);transition:background .15s,border-color .15s,transform .15s}
.chip small{font:500 9.5px var(--mono);color:var(--mute)}
.chip.pre{border-color:rgba(96,165,250,.35)}
.chip.on{background:var(--blue);border-color:var(--blue);transform:translateY(-2px)}
.chip.on small{color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--sans)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.item select{background:var(--panel3);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:500 14px var(--sans)}
.empty a,.empty button.link{color:var(--blue2);background:none;border:0;font:600 14.5px var(--sans);text-decoration:underline;text-underline-offset:3px}
/* a computer: the chat on the left, the sound and the lab on the right */
.side{display:none}
@media (min-width:980px){
  body{background:radial-gradient(900px 600px at 70% -10%,rgba(37,99,235,.12),transparent 70%),var(--bg)}
  .app{max-width:460px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .app::before{display:none}
  .bottom .ear{display:none!important}
  #labBtn,#labFromSheet{display:none}
  .side{display:flex;flex-direction:column;gap:16px;flex:1;max-width:780px;height:calc(100dvh - var(--navh));overflow-y:auto;padding:22px 24px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:grid;gap:12px}
  .panel h2{font:700 19px var(--sans);letter-spacing:-.01em}
  .panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .side .grab{display:none}
  .side .lab{gap:14px}
  .wf{position:relative}
  .wf canvas{display:block;width:100%;height:210px;border-radius:14px;background:#0a0c10}
  .axis{position:absolute;top:6px;bottom:6px;left:10px;display:flex;flex-direction:column;justify-content:space-between;font:500 10px var(--mono);color:var(--mute);pointer-events:none}
  .wfHint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 40px;font-size:14px;color:var(--dim);pointer-events:none}
  .small{font-size:13px;line-height:1.55;color:var(--mute)}
  .center{text-align:center}
  .small b{color:var(--dim);font-family:var(--mono);font-weight:500}
  .top{padding-top:14px}
}
/* DFK Labs: the site bar above and the footer below, as on every dfklabs.com page */
.dfk-logo{display:inline-block;border:2px solid var(--ink);padding:1px 6px;font:800 13px/1.2 Archivo,"Arial Black",Helvetica,sans-serif;letter-spacing:-.5px;color:var(--ink);background:var(--bg);box-shadow:3px 3px 0 var(--blue);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s cubic-bezier(.2,.7,.3,1)}
a:hover>.dfk-logo{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--blue)}
.site{position:relative;z-index:5;height:var(--navh);border-bottom:1px solid var(--line);background:rgba(5,5,5,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.site-in{max-width:1280px;height:100%;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
.site-l{display:flex;align-items:center;gap:12px;min-width:0}
.site-l a{text-decoration:none}
.crumb{font:700 10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.crumb b{color:var(--blue2);font-weight:700}
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{color:var(--ink)}
.site-r{display:flex;align-items:center;gap:18px}
.site-r a,.site-foot nav a{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:7px;transition:color .2s}
.site-r a:hover,.site-foot nav a:hover{color:var(--ink)}
.site-r a.cine{color:#E3B04F}
.site-foot{border-top:1px solid var(--line);padding:44px 24px calc(env(safe-area-inset-bottom) + 48px);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.site-foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px}
.site-foot .tag-line{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.site-foot .labs{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
@media (max-width:640px){.site-r .hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="site" aria-label="DFK Labs">
  <div class="site-in">
    <div class="site-l"><a href="https://dfklabs.com/" aria-label="DFK Labs"><span class="dfk-logo">DFK</span></a><span class="crumb"><a href="https://dfklabs.com/labs">Labs</a> · <b>airgap</b></span></div>
    <div class="site-r">
      <a class="hide-s" data-site="" href="https://dfklabs.com/" data-i18n="navHome"></a>
      <a data-site="projects" href="https://dfklabs.com/projects" data-i18n="navProjects"></a>
      <a href="https://dfklabs.com/labs">Labs</a>
    </div>
  </div>
</nav>
<div class="stage">
<div class="app">
  <header class="top">
    <svg class="avatar" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="32" fill="#16191e"/><g fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"><path d="M24 23a13 13 0 0 1 0 18"/><path d="M32 17a22 22 0 0 1 0 30"/><path d="M40 11a31 31 0 0 1 0 42"/></g><circle cx="17" cy="32" r="5" fill="#f3f4f6"/></svg>
    <div class="who"><b>airgap</b><span id="status"><i></i><em id="statusText" style="font-style:normal"></em></span></div>
    <button class="pill" id="listen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="listenLabel"></span></button>
    <button class="icon" id="labBtn" data-i18n-label="labOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg></button>
    <button class="icon" id="info" data-i18n-label="infoOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  </header>

  <div id="thread" aria-live="polite"></div>

  <p class="note" data-i18n="note"></p>
  <div class="banner" id="banner" hidden role="alert"><p id="bannerText"></p><button type="button" id="bannerClose" aria-label="×">×</button></div>

  <div class="bottom">
    <div class="ear" id="ear" hidden><span data-i18n="earLabel"></span><canvas id="scope" width="600" height="56" aria-hidden="true"></canvas><b id="level"></b></div>
    <div class="seg" role="group">
      <button type="button" id="modeChirp" aria-pressed="true">Chirp</button>
      <button type="button" id="modeMorse" aria-pressed="false">Morse</button>
    </div>
    <div class="bar">
      <label class="field">
        <span class="sr" data-i18n="placeholder"></span>
        <textarea id="text" rows="1" maxlength="240" enterkeyhint="send"></textarea>
        <span class="hint"><span id="count"></span><span id="dur"></span></span>
      </label>
      <button class="send" id="send" disabled data-i18n-label="sendLabel"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>

<aside class="side" id="side">

async function copy(s) { try { await navigator.clipboard.writeText(s); toast(t('copied')); } catch (e) { toast(t('copyFail')); } }
function add(m) {

// ---- sound out. One thing plays at a time; the microphone is let go while the
// phone speaks (so iOS keeps the loudspeaker and the page does not hear itself)
// and picked up again straight after.
let queue = Promise.resolve();
function play(samples, onProgress) {
  const job = queue.then(() => new Promise((done) => {
    const a = audio();
    const resume = wantListen;
    if (resume) stopListening(true);
    const buf = a.createBuffer(1, samples.length, a.sampleRate);
    buf.copyToChannel(samples, 0);
    const src = a.createBufferSource(); src.buffer = buf; src.connect(a.destination);
    const secs = samples.length / a.sampleRate, t0 = performance.now();

    // What is played goes through the waterfall too, so a sender sees its own chirp.
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / 1000 / secs);
      const at = Math.floor(p * samples.length);
      while (shown + HOP <= at) { shown += HOP; draw(samples.subarray(Math.max(0, shown - 1024), shown), a.sampleRate, true); }
      if (onProgress) onProgress(p);
      if (p < 1 && going) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    src.onended = () => { going = false; if (onProgress) onProgress(1); if (resume) startListening(); done(secs); };

  }));

    const o = a.createOscillator(), g = a.createGain();

  });

// A chirped message waits for its receipt; if none comes it goes again by
// itself, twice at most, with the same id so the other phone can put the
// pieces of every try together.
const TRIES = 3;
let retryTimer = 0;
async function transmit(m, attempt = 1) {

  const samples = m.mode === 'morse' ? morseEncode(m.text, a.sampleRate) : encode(m.text, a.sampleRate, m.pid);
  const r = () => thread.querySelector(`[data-id="${m.key}"] .prog`);
  m.try = attempt; m.tries = Math.max(m.tries || 1, attempt); m.secs = samples.length / a.sampleRate;
  if (m.mode === 'chirp') m.n = Math.max(1, Math.ceil(bytes(m.text) / PACKET));

  await play(samples, (p) => { const el = r(); if (el) el.style.transform = `scaleX(${p})`; });
  const el = r(); if (el) el.style.transform = 'scaleX(0)';
  busy = false; send.classList.remove('busy'); refresh();
  // Pick up the microphone after the first send, so the receipt can be heard.

  if (m.mode !== 'chirp' || !wantListen) { if (m.state === 'sending') { m.state = 'sent'; m.try = 0; update(m); } return; }

    else { m.state = 'sent'; m.try = 0; update(m); }

send.onclick = () => {
  let msg = text.value.trim();
  if (!msg || busy) return;
  if (mode === 'morse') { msg = morseText(msg); if (!msg) { toast(t('morseOnly')); return; } }
  const m = add({ key: newKey(), who: 'me', text: msg, mode, at: Date.now(), state: 'sending', id: mode === 'chirp' ? idOf(msg) : null });
  text.value = ''; grow(); refresh();
  transmit(m);
};
function resend(m) { if (busy) return; m.state = 'sending'; m.at = Date.now(); update(m); transmit(m); }

function refresh() {
  const v = text.value, n = bytes(v);
  if (mode === 'morse') {
    const s = morseText(v);
    $('count').textContent = t('letters', { n: s.length }); $('count').className = '';
    $('dur').textContent = s ? `${t('secs', { s: num(morseDuration(s)) })} · ${morseCode(s)}` : t('morseHint');
    send.disabled = busy || !s;
  } else {
    $('count').textContent = `${n} / ${MAX_BYTES}`; $('count').className = n > MAX_BYTES ? 'over' : '';
    $('dur').textContent = v.trim() ? t('secs', { s: num(duration(v)) }) : '';

}
function grow() { text.style.height = 'auto'; text.style.height = Math.min(140, text.scrollHeight) + 'px'; }
text.addEventListener('input', () => { grow(); refresh(); });
text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) send.click(); } });

$('modeChirp').onclick = () => setMode('chirp');

// A message on its way: its pieces light up as they arrive, blue on the first
// try and green when a later try fills a gap.
let live = null;   // { kind: 'chirp' | 'morse', id, count, pk: [pass per piece], pass, lastK, cl: [], el }
function liveRow(kind, label) {

function dropLive() { if (live) { live.el.remove(); live = null; } }
function onPart(p) {

      const prev = parts.get(p.id);
      dropLive();
      live = { kind: 'chirp', id: p.id, count: p.count, pk: prev && prev.count === p.count ? prev.pk : new Array(p.count).fill(0), pass: prev ? prev.pass + 1 : 1, lastK: -1, cl: prev ? prev.cl : [], el: null };
      if (p.count > 1) live.el = liveRow('chirp', t('receiving'));
      else live.el = document.createElement('div');
    }
  }
  if (p.k <= live.lastK) live.pass++;           // a new try began
  live.lastK = p.k;
  if (!live.pk[p.k]) live.pk[p.k] = live.pass;
  live.cl.push(p.clarity);
  parts.set(p.id, { count: p.count, pk: live.pk, pass: live.pass, cl: live.cl });
  if (p.count > 1) {
    const box = live.el.querySelector('.pieces');
    box.innerHTML = live.pk.map((v, i) => `<i class="${v > 1 ? 'p2' : v ? 'p1' : ''}${i === p.k ? ' new' : ''}"></i>`).join('');
    if (p.have < p.count) setStatus('receivingLong', true, { have: p.have, count: p.count });
  }
}
const parts = new Map();     // what was seen of each message id, across tries
function heardChirp(msg) {
  const info = parts.get(msg.id) || { pk: [1], cl: [] };
  const done = live && live.id === msg.id ? live : null;
  if (done) { dropLive(); }
  setStatus('listening', true);
  const id = ackOf(msg.text);
  if (id) {
    parts.delete(msg.id);
    // A receipt: mark the newest message of ours it names.
    for (let i = msgs.length - 1; i >= 0; i--) { const m = msgs[i]; if (m.who === 'me' && m.id === id) { if (m.state !== 'heard') { m.state = 'heard'; update(m); chime(); buzz([20, 60, 20]); toast(t('toastHeard')); } break; } }
    return;
  }
  // The same message again within half a minute is the sender trying again: no
  // second bubble, but it gets its receipt, since it evidently did not hear one.
  const dup = msgs.some((m) => m.who === 'them' && m.text === msg.text && Date.now() - m.at < 30000);
  if (!dup) {
    const cl = info.cl.length ? info.cl.reduce((a, b) => a + b, 0) / info.cl.length : 0;
    add({ key: newKey(), who: 'them', text: msg.text, mode: 'chirp', at: Date.now(), n: info.pk.length, pk: info.pk.slice(), tries: Math.max(1, ...info.pk), cl });
    buzz(30);
  }
  parts.delete(msg.id);
  if (receipts) setTimeout(() => play(encode(ackFor(msg.text), audio().sampleRate, newId())), 700);
}
function morseTyping(s) {
  if (!live || live.kind !== 'morse') { dropLive(); live = { kind: 'morse', el: liveRow('morse', t('hearing')) }; }
  live.el.querySelector('.bubble').textContent = s; thread.scrollTop = thread.scrollHeight;
}
function heardMorse(s) {
  if (live && live.kind === 'morse') dropLive();
  if (msgs.some((m) => m.who === 'them' && m.text === s && Date.now() - m.at < 30000)) return;
  add({ key: newKey(), who: 'them', text: s, mode: 'morse', at: Date.now() });
  buzz(30);
}

const inApp = () => /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|Snapchat|LinkedInApp|GSA\//i.test(navigator.userAgent) || (/iPhone|iPad/.test(navigator.userAgent) && !/Safari\//.test(navigator.userAgent));
async function getMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { const e = new Error('no media'); e.name = 'NoMedia'; throw e; }
  try {
    // Echo cancellation and noise suppression would treat the tones as noise.
    return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e;
    return await navigator.mediaDevices.getUserMedia({ audio: true });
  }
}
function micError(e) {
  wantListen = false; paintListen();
  const n = (e && e.name) || '', ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  banner(inApp() ? 'errInApp' : n === 'NotAllowedError' || n === 'SecurityError' ? (ios ? 'errBlockedIos' : 'errBlocked')
    : n === 'NotReadableError' ? 'errBusy' : n === 'NoMedia' ? 'errNoMedia' : n === 'NotFoundError' ? 'errNotFound' : 'errSilence');
  setStatus('micOff', false);
}

// The audio engine is always made after the microphone answers: on iOS an
// engine made before the capture can take the stream and hand back silence.
let frames = 0, peak = 0, watchdog = 0;
function wire(a) {
  source = a.createMediaStreamSource(stream);
  proc = a.createScriptProcessor(4096, 1, 1);
  rx = new Receiver(a.sampleRate, { onMessage: heardChirp, onPart, onError: () => setStatus('unclear', true) });
  mrx = new MorseReceiver(a.sampleRate, { onChar: morseTyping, onText: heardMorse });
  proc.onaudioprocess = (e) => {
    frames++;
    const x = e.inputBuffer.getChannelData(0);
    for (let i = 0; i < x.length; i += 8) { const v = Math.abs(x[i]); if (v > peak) peak = v; }
    const c = new Float32Array(x);
    rx.push(c); mrx.push(c); drawBlock(c, a.sampleRate, true);
  };
  source.connect(proc); proc.connect(a.destination);
}
async function startListening() {
  banner('');
  if (stream) stopListening(true);
  wantListen = true; paintListen(); setStatus('starting', false);
  frames = 0; peak = 0;
  try {
    stream = await getMic();
    if (!wantListen) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; return; }
    if (ctx) { const old = ctx; ctx = null; try { await old.close(); } catch (x) { /* already closed */ } }
    const a = audio();
    wire(a);
    try { await a.resume(); } catch (x) { /* the watchdog asks for a tap */ }
    setStatus('listening', true);
    $('ear').hidden = false; $('level').textContent = t('quiet');
    clearTimeout(watchdog);
    watchdog = setTimeout(check, 2500);
  } catch (e) {
    if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
    micError(e);
  }
}
// No audio at all after 2.5 s: the engine is asleep, so the next tap restarts
// everything inside that tap. Audio of exact silence: the stream is dead.
function check() {
  if (!wantListen) return;
  if (!frames) { setStatus('tapToStart', false); document.addEventListener('pointerdown', kick, { once: true, capture: true }); return; }
  if (peak === 0) { stopListening(false); const e = new Error('silence'); e.name = 'Silence'; micError(e); }
}
function kick(ev) { if (ev && ev.target && ev.target.closest && ev.target.closest('#listen')) return; startListening(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && wantListen && ctx.state !== 'running') ctx.resume().catch(() => {}); });
function stopListening(keepWish) {
  clearTimeout(watchdog);
  if (proc) { proc.disconnect(); proc.onaudioprocess = null; proc = null; }
  if (source) { source.disconnect(); source = null; }
  if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
  if (live && live.kind === 'morse') dropLive();
  if (!keepWish) { wantListen = false; $('ear').hidden = true; setStatus('micOff', false); dropLive(); }
  else setStatus('sendingNow', true);
  paintListen();
}
function paintListen() { listenBtn.classList.toggle('on', wantListen); listenBtn.setAttribute('aria-pressed', String(wantListen)); $('listenLabel').textContent = t(wantListen ? 'listening' : 'listen'); }
listenBtn.onclick = () => { if (wantListen) { store.set('noAutoListen', true); stopListening(false); } else { store.set('noAutoListen', false); startListening(); } };

// ---- what the microphone hears, as a waterfall: time runs right to left,
// pitch bottom to top, loudness as light. A chirp is a staircase of short
// dashes; Morse is one steady line low down.
const scope = $('scope'), sc = scope.getContext('2d'), big = $('big'), bc = big.getContext('2d');
const BINS = 96, LO = 600, HI = 3700, HOP = 2048;
const FREQS = Array.from({ length: BINS }, (_, i) => LO + (HI - LO) * i / (BINS - 1));
function colour(v) {   // 0..1 → near black → blue → white
  const a = Math.max(0, Math.min(1, v));
  const r = Math.round(a < 0.6 ? 10 + a / 0.6 * 27 : 37 + (a - 0.6) / 0.4 * 206);
  const g = Math.round(a < 0.6 ? 12 + a / 0.6 * 87 : 99 + (a - 0.6) / 0.4 * 145);
  const b = Math.round(a < 0.6 ? 16 + a / 0.6 * 219 : 235 + (a - 0.6) / 0.4 * 11);
  return `rgb(${r},${g},${b})`;
}
function column(cv, cx, e, colw, step) {
  const W = cv.width, H = cv.height, n = e.length / step, bh = H / n;
  cx.drawImage(cv, -colw, 0);
  for (let i = 0; i < n; i++) {
    let v = 0; for (let j = 0; j < step; j++) v = Math.max(v, e[i * step + j]);
    cx.fillStyle = colour(v); cx.fillRect(W - colw, H - (i + 1) * bh, colw, Math.ceil(bh));
  }
}
let drawn = false, ref = 1e-3;
const HANN = Float32Array.from({ length: 1024 }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / 1023));
/** One column of the waterfall from the last 1024 samples of x. */
function draw(x, rate, label = true) {
  const N = Math.min(1024, x.length), start = x.length - N;
  // A Hann window keeps a loud tone from smearing light over every other pitch.
  const e = FREQS.map((f) => { const k = 2 * Math.cos(2 * Math.PI * f / rate); let s1 = 0, s2 = 0; for (let i = 0; i < N; i++) { const s0 = x[start + i] * HANN[i] + k * s1 - s2; s2 = s1; s1 = s0; } return Math.sqrt(Math.max(0, s1 * s1 + s2 * s2 - k * s1 * s2)) / N; });
  // Loudness against the loudest recent sound, over 45 dB: quiet rooms and loud chirps both read.
  let best = 0, bi = 0; e.forEach((v, i) => { if (v > best) { best = v; bi = i; } });
  ref = Math.max(best, ref * 0.985, 2e-4);
  const lv = e.map((v) => 1 + 20 * Math.log10((v + 1e-9) / ref) / 45);
  column(scope, sc, lv, 3, 2);
  if (wide.matches) { column(big, bc, lv, 3, 1); if (!drawn) { drawn = true; $('wfHint').hidden = true; } }
  // Which of the two it sounds like right now.
  const what = best > 0.002 ? (Math.abs(FREQS[bi] - MORSE_HZ) < 120 ? 'morse' : 'chirp') : t('quiet');
  if (label) { $('level').textContent = what; $('wfState').textContent = what; }
}
/** Feed a block (mic or our own sound) to the waterfall, one column per HOP samples. */
function drawBlock(x, rate, label) { for (let end = HOP; end <= x.length; end += HOP) draw(x.subarray(0, end), rate, label); }

// ---- the lab: a word, taken apart, then played slowly enough to follow.
const labText = $('labText');
let labPlaying = 0;
function lab() {
  const s = labText.value || ' ';
  const data = [...new TextEncoder().encode(s)];
  const chars = [...s];
  // Bytes, grouped under the character they came from.
  let bi = 0; const byteChips = [];
  for (const c of chars) { for (const b of new TextEncoder().encode(c)) { byteChips.push(`<span class="chip">${b.toString(16).toUpperCase().padStart(2, '0')}<small>${esc(c === ' ' ? '␣' : c)} · ${b}</small></span>`); bi++; } }
  $('labBytes').innerHTML = byteChips.join('');
  $('labNibbles').innerHTML = data.map((b) => [b >> 4, b & 15].map((v) => `<span class="chip">${v.toString(16).toUpperCase()}<small>${v.toString(2).padStart(4, '0')}</small></span>`).join('')).join('');
  const syms = symbolsFor(s, 0).filter((v) => v >= 0);
  $('labTones').innerHTML = syms.map((v, i) => `<span class="chip${i < PREAMBLE.length ? ' pre' : ''}" data-i="${i}">${v.toString(16).toUpperCase()}<small>${Math.round(BASE + v * STEP)} Hz</small></span>`).join('');
}
labText.addEventListener('input', lab);
function labPlay(slow) {
  const s = labText.value || ' ';
  const syms = symbolsFor(s, 0).filter((v) => v >= 0);
  const a = audio(), rate = a.sampleRate;
  const sym = slow ? 0.28 : SYM, gap = slow ? 0.07 : GAP;
  const samples = slow ? (() => {
    const n = Math.round(sym * rate), g = Math.round(gap * rate), fade = Math.round(0.01 * rate);
    const out = new Float32Array(syms.length * (n + g) + Math.round(0.3 * rate)); let o = Math.round(0.1 * rate);
    for (const v of syms) { const w = 2 * Math.PI * (BASE + v * STEP) / rate; for (let i = 0; i < n; i++) out[o + i] = 0.7 * Math.min(1, i / fade, (n - 1 - i) / fade) * Math.sin(w * i); o += n + g; }
    return out;
  })() : encode(s, rate, 0);
  const lead = 0.1, slot = sym + gap, chips = [...$('labTones').children];
  const run = ++labPlaying;
  play(samples, (p) => {
    if (run !== labPlaying) return;
    const at = p * samples.length / rate - lead;
    const i = Math.floor(at / slot);
    chips.forEach((c, j) => c.classList.toggle('on', j === i && at >= 0 && p < 1));
  });
}
$('labSlow').onclick = () => labPlay(true);
$('labFast').onclick = () => labPlay(false);

// ---- the sheets
const sheet = $('sheet'), labSheet = $('labSheet');
// On a computer the lab lives in the side panel instead of a sheet.
const labCard = labSheet.querySelector('.lab');
function layout() { if (wide.matches) { $('sideLab').append(labCard); openSheet(labSheet, false); } else if (labCard.parentNode !== labSheet) labSheet.append(labCard); }
if (wide.addEventListener) wide.addEventListener('change', layout); else wide.addListener(layout);
layout();
$('here').textContent = location.host + location.pathname.replace(/index\.html$/, '');
function openSheet(el, o) { el.classList.toggle('open', o); el.setAttribute('aria-hidden', String(!o)); }
$('info').onclick = () => openSheet(sheet, true);
$('labBtn').onclick = () => openSheet(labSheet, true);
$('labFromSheet').onclick = () => { openSheet(sheet, false); openSheet(labSheet, true); };
[sheet, labSheet].forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) openSheet(el, false); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { openSheet(sheet, false); openSheet(labSheet, false); } });
const paintReceipts = () => $('receipts').setAttribute('aria-checked', String(receipts));
$('receipts').onclick = () => { receipts = !receipts; store.set('receipts', receipts); paintReceipts(); };
$('clear').onclick = () => { if (!msgs.length) return openSheet(sheet, false); msgs = []; save(); paintChat(); openSheet(sheet, false); toast(t('cleared')); };

// Messages that were still going out when the page closed went out, or did not: say sent.
msgs.forEach((m) => { if (m.state === 'sending') m.state = 'sent'; m.try = 0; });
sel.value = lang; mode = store.get('mode', 'chirp');
applyLang(); paintReceipts(); grow();
// The service worker that kept an offline copy is retired; remove any left on the device.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
window.__airgap = { started: () => !!rx, lang: () => lang };
})();
</script>
